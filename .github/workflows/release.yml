name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  debian-package:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y build-essential cmake ninja-build pkg-config qt6-base-dev libqt6sql6-sqlite dpkg-dev fakeroot file
      - run: cmake --preset release
      - run: cmake --build --preset release -j2
      - run: ctest --test-dir build/release --output-on-failure
      - run: cd build/release && cpack -G DEB && cpack -G TGZ
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/*.deb
            build/release/*.tar.gz
